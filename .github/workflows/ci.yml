name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy swapcheck
      - name: Tests (offline, no API keys)
        run: pytest --cov=swapcheck --cov-fail-under=85 -q

  smoke-verdict:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Safe candidate must SHIP
        run: |
          swapcheck run \
            --baseline configs/baseline_mock.yaml \
            --candidate configs/baseline_mock.yaml \
            --judge configs/judge_mock.yaml \
            --suite suites/booking \
            --output-dir runs/smoke-safe --no-cache --fail-on not-ship
      - name: Unsafe candidate must HOLD
        run: |
          set +e
          swapcheck run \
            --baseline configs/baseline_mock.yaml \
            --candidate configs/candidate_mock_unsafe.yaml \
            --suite suites/booking \
            --output-dir runs/smoke-unsafe --no-cache --fail-on hold
          code=$?
          if [ "$code" -ne 10 ]; then
            echo "Expected exit code 10 (HOLD) but got $code"
            exit 1
          fi
      - name: Publish report to the job summary
        run: cat runs/smoke-safe/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment verdict on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('runs/smoke-safe/report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## SwapCheck offline smoke verdict\n\n${body}`,
            });
